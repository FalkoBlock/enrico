<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Erik">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Erik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --ink: #000000; --muted: #7A7A7A; --line: #000000; --hair: #E6E6E6; --press: #F4F4F4; --ring: #CFCFCF;
    --font: "Inter Tight", -apple-system, "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --ink: #FFFFFF; --muted: #8C8C8C; --line: #FFFFFF; --hair: #262626; --press: #141414; --ring: #3D3D3D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --ink: #FFFFFF; --muted: #8C8C8C; --line: #FFFFFF; --hair: #262626; --press: #141414; --ring: #3D3D3D;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
         font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased;
         -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- Liste ---------- */
  .wrap { max-width: 640px; margin: 0 auto; padding: 22px 20px 64px; }
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--hair); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { white-space: nowrap; flex: none; }
  .tabs button { background: none; border: 0; padding: 10px 0 12px; margin-bottom: -1px; cursor: pointer;
                 font-size: 15px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  header { padding: 44px 0 34px; }
  h1 { margin: 0; font-size: clamp(42px, 12vw, 64px); font-weight: 600; line-height: .95; letter-spacing: -0.045em; }
  .meta { display: flex; gap: 28px; margin-top: 22px; }
  .meta div { display: flex; flex-direction: column; }
  .meta b { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .meta span { font-size: 13px; color: var(--muted); margin-top: 6px; }

  h2 { display: flex; justify-content: space-between; margin: 34px 0 0; padding-bottom: 10px;
       border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  h2 small { font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  h2.plain { margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--hair); display: flex; align-items: flex-start; gap: 12px; }
  .done .name, .done .dur, .done .dur small { color: var(--muted); }
  .done .fig { opacity: .35; }
  .prog { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px;
          padding-top: 14px; border-top: 1px solid var(--hair); font-size: 15px; font-weight: 500; }
  .link { background: none; border: 0; padding: 6px 0; font-size: 15px; font-weight: 500; color: var(--muted);
          text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .pill { border: 0; border-radius: 22px; height: 42px; padding: 0 20px; background: var(--ink); color: var(--bg);
          font-size: 15px; font-weight: 600; cursor: pointer; }
  .pill.ghost { background: none; color: var(--ink); border: 1px solid var(--ink); }
  .pill.ghost:active { background: var(--press); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
           z-index: 20; display: flex; align-items: center; gap: 18px; padding: 0 8px 0 20px; height: 52px; border-radius: 26px;
           background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; white-space: nowrap;
           box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .toast button { background: none; border: 0; color: var(--bg); font-weight: 700; padding: 0 12px; height: 40px; cursor: pointer;
                  text-decoration: underline; text-underline-offset: 3px; }
  .row { flex: 1; min-width: 0; width: 100%; display: grid; grid-template-columns: 60px 1fr auto; gap: 0 14px; align-items: center;
         text-align: left; background: none; border: 0; padding: 16px 0; cursor: pointer; }
  .row:active { background: var(--press); }
  .num { align-self: start; padding-top: 3px; font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fig { width: 60px; height: 38px; color: var(--ink); }
  .txt { min-width: 0; }
  .name { display: block; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
          margin-top: 2px; color: var(--muted); font-size: 14px; line-height: 1.35; }
  .dur small { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; text-align: right; }
  .dur { text-align: right; align-self: start; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
         font-variant-numeric: tabular-nums; white-space: nowrap; }

  .fig polyline { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .fig .l { stroke-width: 4.4; }
  .fig .t { stroke-width: 6.6; }
  .fig .w { stroke-width: 1.4; opacity: .45; }
  .fig .g { stroke-width: 3; }
  .fig circle { fill: currentColor; }
  .fig circle.o { fill: none; stroke: currentColor; stroke-width: 2; }

  /* ---------- Timer ---------- */
  .timer { position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--ink); display: none;
           flex-direction: column; padding: 0 22px calc(26px + env(safe-area-inset-bottom, 0px));
           transition: background .25s, color .25s; }
  .timer.open { display: flex; }
  /* Seitenwechsel: Fläche invertiert, aus der Distanz erkennbar */
  .timer.rest { background: var(--ink); color: var(--bg); }
  .progress { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px; background: var(--hair); }
  .progress i { display: block; height: 100%; width: 0; background: #1E6BFF; transition: width .1s linear; }
  .t-top { padding-top: calc(26px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between;
           font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .t-top span:first-child { opacity: .55; }
  .t-main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 600px; width: 100%; margin: 0 auto; }
  .t-main .fig { width: 150px; height: 94px; color: currentColor; margin-bottom: 26px; }
  .t-main h3 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; }
  .t-main p { margin: 10px 0 0; font-size: 17px; opacity: .6; max-width: 32ch; }
  .time { margin-top: 30px; font-size: clamp(104px, 34vw, 180px); font-weight: 600; line-height: .85;
          letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
  .time.target { font-size: clamp(56px, 18vw, 96px); line-height: .95; letter-spacing: -0.045em; }
  .unit { margin-top: 10px; font-size: 19px; font-weight: 500; opacity: .6; }
  .note { margin: 22px 0 0; font-size: 14px; color: var(--muted); max-width: 46ch; }
  .timer.reps .progress { visibility: hidden; }
  .timer.paused .time { opacity: .3; }
  .actions { display: flex; gap: 10px; max-width: 600px; width: 100%; margin: 0 auto; }
  .btn { flex: 1; height: 56px; border-radius: 28px; font-weight: 600; font-size: 17px; cursor: pointer; }
  .primary { background: currentColor; border: 0; }
  .primary span { color: var(--bg); }
  .timer.rest .primary span { color: var(--ink); }
  .secondary { background: none; border: 1px solid currentColor; }
  .status { max-width: 600px; width: 100%; margin: 14px auto 0; font-size: 12px; opacity: .5; min-height: 1.3em; }

  @media (prefers-reduced-motion: reduce) { .progress i, .timer { transition: none; } }




  /* Abhak-Kreis: 44 px Trefferfläche, 28 px sichtbar */
  .check { flex: none; width: 44px; height: 44px; margin: 7px 0 0 -8px; padding: 0; border: 0; background: none;
           display: grid; place-items: center; cursor: pointer; }
  .check .dot { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--ring); display: grid; place-items: center;
                font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums;
                transition: background .18s, border-color .18s, color .18s; }
  .check svg { width: 12px; height: 12px; }
  .done .check .dot { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  li { gap: 4px; }
  .start { width: 100%; height: 56px; margin-top: 22px; border: 0; border-radius: 28px; background: var(--ink); color: var(--bg);
           font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .start svg { width: 14px; height: 14px; fill: currentColor; }
  .start:active { opacity: .85; }
  .btn.skip[hidden] { display: none; }
  .timer.lead .time { opacity: 1; }
  /* Satz-/Serien-Segmente unter der Zahl */
  .segs { display: flex; gap: 6px; margin-top: 24px; max-width: 340px; }
  .segs i { flex: 1; height: 3px; border-radius: 2px; background: currentColor; opacity: .16; transition: opacity .2s; }
  .segs i.on { opacity: 1; }
  .segs i.cur { opacity: .5; }
  .dash { display: inline-block; margin: 0 .09em; letter-spacing: 0; }
  .meta b span.dash { font-size: inherit; color: inherit; margin: 0 .09em; }
  .time.target { letter-spacing: -0.03em; }
  .early { align-self: flex-start; margin-top: 16px; padding: 6px 0; background: none; border: 0; color: inherit; opacity: .65;
           font-size: 15px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
</style>
</head>
<body>
<main class="wrap">
  <nav class="tabs" id="tabs" aria-label="Block wählen"></nav>
  <header>
    <h1 id="title"></h1>
    <div class="meta">
      <div><b id="mCount"></b><span>Übungen</span></div>
      <div id="mMinBox"><b id="mMin"></b><span>Minuten</span></div>
    </div>
    <p class="note" id="note" hidden></p>
    <button type="button" class="start" id="startBtn"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.6v10.8c0 .7.8 1.1 1.4.7l8.1-5.4c.5-.4.5-1.1 0-1.4L4.4.9C3.8.5 3 .9 3 1.6z"/></svg><span id="startLabel">Block starten</span></button>
    <div class="prog" id="prog" hidden><span id="progText"></span><button type="button" class="pill ghost" id="resetBtn">Zurücksetzen</button></div>
  </header>
  <div id="sections"></div>
</main>

<div class="toast" id="toast" hidden><span>Zurückgesetzt</span><button type="button" id="undoBtn">Rückgängig</button></div>

<section class="timer" id="timer" aria-live="polite">
  <div class="progress"><i id="bar"></i></div>
  <div class="t-top"><span id="tSection"></span><span id="tPhase"></span></div>
  <div class="t-main">
    <svg class="fig" id="tFig" viewBox="0 0 80 50" aria-hidden="true"></svg>
    <h3 id="tName"></h3>
    <p id="tDesc"></p>
    <div class="time" id="tTime">0:00</div>
    <div class="unit" id="tUnit"></div>
    <div class="segs" id="segs" hidden></div>
    <button type="button" class="early" id="earlyBtn" hidden>Schon genug – Übung abschließen</button>
  </div>
  <div class="actions">
    <button class="btn secondary" id="stopBtn" type="button"><span id="stopLabel">Abbrechen</span></button>
    <button class="btn primary" id="pauseBtn" type="button"><span id="pauseLabel">Pause</span></button>
    <button class="btn secondary skip" id="skipBtn" type="button" hidden>Nächste</button>
  </div>
  <div class="status" id="status"></div>
</section>

    tTime.textContent = fmt(remaining);
    bar.style.width = ((1 - remaining / phases[pi].len) * 100) + "%";
  }
  function step() {
    if (paused) return;
    remaining = Math.max(0, (endTime - Date.now()) / 1000);
    draw();
    var whole = Math.ceil(remaining);
    if (whole !== lastWhole) { lastWhole = whole; if (whole >= 1 && whole <= 3) beep(1, 520, 0.12); }
    if (remaining <= 0) {
      if (pi + 1 < phases.length) { beep(1, phases[pi + 1].rest ? 660 : 880); enterPhase(pi + 1); }
      else finish();
    }
  }

  function begin(ex) {
    gen++; clearInterval(tick); tick = null;
    current = ex; paused = false;
    primeAudio(); keepAwake();
    document.getElementById("tFig").innerHTML = F[ex.fig];
    document.getElementById("tName").textContent = ex.name;
    document.getElementById("tDesc").textContent = ex.desc;
    document.getElementById("tSection").textContent = run
      ? ex.section + " \u00b7 " + pad(run.i + 1) + "/" + pad(run.queue.length) : ex.section;
    timerEl.classList.remove("paused", "rest", "reps");
    timerEl.classList.add("open");
    skipBtn.hidden = !run;
    stopLabel.textContent = run ? "Beenden" : "Abbrechen";

    earlyBtn.hidden = true; segsEl.hidden = true;
    if (!ex.sec) {                                  // Wiederholungsübung: Vorgabe + Serienzähler
      mode = "reps";
      timerEl.classList.add("reps");
      var R = ex.reps || {};
      rep = { R: R, n: R.count || 1, min: R.min || R.count || 1, rest: R.rest || 0, done: 0, resting: false };
      showRepState();
      return;
    }
    mode = "timer";
    tTime.classList.remove("target"); tUnit.textContent = "";
    primaryLabel.textContent = "Pause";
    var between = run && run.i > 0;
    phases = buildPhases(ex, between ? NEXT_SEC : LEAD_SEC, between ? "Als Nächstes" : "Bereitmachen");
    enterPhase(0);
    tick = setInterval(step, 100);
  }
  var rep = null;
  function repWord() { return rep.R.of || "Serie"; }
  function showRepState() {
    var R = rep.R, last = rep.done + 1 >= rep.n;
    rep.resting = false;
    timerEl.classList.remove("rest");
    tTime.classList.add("target");
    tTime.innerHTML = rangeHTML(R.target || "");
    tUnit.textContent = R.target ? (R.unit || "") : "Nach Anleitung";
    tPhase.textContent = rep.n > 1 ? repWord() + " " + (rep.done + 1) + " von " + rep.n : "";
    primaryLabel.textContent = rep.n > 1 && !last ? repWord() + " geschafft" : "Fertig";
    earlyBtn.hidden = !(rep.n > 1 && rep.done >= rep.min);
    renderSegs(rep.n, rep.done, rep.done);
  }
  function startRepRest() {
    rep.resting = true;
    timerEl.classList.add("rest");
    tTime.classList.remove("target");
    tPhase.textContent = "Pause";
    tUnit.textContent = "Dann " + repWord() + " " + (rep.done + 1) + " von " + rep.n;
    primaryLabel.textContent = "Weiter";
    earlyBtn.hidden = !(rep.done >= rep.min);
    renderSegs(rep.n, rep.done, -1);
    remaining = rep.rest; endTime = Date.now() + remaining * 1000; lastWhole = Math.ceil(remaining);
    tTime.textContent = fmt(remaining);
    tick = setInterval(function () {
      remaining = Math.max(0, (endTime - Date.now()) / 1000);
      tTime.textContent = fmt(remaining);
      var whole = Math.ceil(remaining);
      if (whole !== lastWhole) { lastWhole = whole; if (whole >= 1 && whole <= 3) beep(1, 520, 0.12); }
      if (remaining <= 0) { beep(1, 880); endRepRest(); }
    }, 100);
  }
  function endRepRest() { clearInterval(tick); tick = null; showRepState(); }
  earlyBtn.addEventListener("click", function () {
    if (!current) return;
    clearInterval(tick); tick = null; markDone(current); next();
  });

  function next() {
    if (run && run.i + 1 < run.queue.length) { run.i++; begin(run.queue[run.i]); }
    else close();
  }
  function finish() {
    clearInterval(tick); tick = null;
    beep(2, 988);
    markDone(current);
    renderSegs(current.sets, current.sets, -1);
    tPhase.textContent = ""; tTime.textContent = "Fertig";
    var g = gen;
    setTimeout(function () { if (g === gen && current) next(); }, 1200);
  }
  function close() {
    gen++; clearInterval(tick); tick = null; current = null; run = null;
    allowSleep(); statusEl.textContent = "";
    timerEl.classList.remove("open", "rest", "reps", "paused");
    render();
  }

  primaryBtn.addEventListener("click", function () {
    if (!current) return;
    if (mode === "reps") {
      if (rep.resting) { endRepRest(); return; }
      if (rep.done + 1 < rep.n) {
        rep.done++; beep(1, 880);
        if (rep.rest > 0) startRepRest(); else showRepState();
        return;
      }
      markDone(current); next(); return;
    }
    if (!tick) return;
    if (paused) { endTime = Date.now() + remaining * 1000; tPhase.textContent = phases[pi].label; }
    else tPhase.textContent = "Pausiert";
    paused = !paused;
    primaryLabel.textContent = paused ? "Weiter" : "Pause";
    timerEl.classList.toggle("paused", paused);
  });
  document.getElementById("stopBtn").addEventListener("click", close);
  skipBtn.addEventListener("click", function () { if (current) next(); });
  document.getElementById("startBtn").addEventListener("click", function () {
    var B = BLOCKS[active], done = doneOf(B.id);
    var queue = B.items.filter(function (ex) { return !done[ex.key]; });
    if (!queue.length) return;
    run = { queue: queue, i: 0 };
    begin(queue[0]);
  });

  // ---------- Offline-Betrieb (nur auf der eigenen GitHub-Pages-Adresse) ----------
  if ("serviceWorker" in navigator && location.protocol === "https:" && /\.github\.io$/.test(location.hostname)) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  render();
})();
</script>
